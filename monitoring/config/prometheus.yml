global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 5s : les compressions / insertions durent quelques secondes, 15s les lisserait trop.
  - job_name: node
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          machine: 'poste'

  # honor_labels : garde les labels poussés par les scripts (outil, niveau, methode...)
  - job_name: pushgateway
    honor_labels: true
    scrape_interval: 5s
    static_configs:
      - targets: ['pushgateway:9091']

  - job_name: cadvisor
    scrape_interval: 5s
    static_configs:
      - targets: ['cadvisor:8080']

  # proxy TCP de comptage d'octets (storing/transfer/proxy.py), lancé sur l'hôte
  - job_name: transfert-proxy
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:9101']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
